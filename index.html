<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOTO7 予想＆分析ツール</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .ball {
            width: 3rem;
            height: 3rem;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.25rem;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            text-shadow: 1px 1px 2px rgba(255,255,255,0.5);
        }
        .ball-yellow { background: linear-gradient(135deg, #fef08a, #eab308); color: #422006; }
        .ball-gray   { background: linear-gradient(135deg, #9ca3af, #4b5563); color: #ffffff; text-shadow: 1px 1px 2px rgba(0,0,0,0.8); }
        .ball-blue   { background: linear-gradient(135deg, #93c5fd, #3b82f6); color: #1e3a5f; text-shadow: none; }
        .ball-purple { background: linear-gradient(135deg, #c4b5fd, #8b5cf6); color: #2e1065; text-shadow: none; }

        /* スマホ用調整 */
        @media (max-width: 640px) {
            .ball { width: 2.5rem; height: 2.5rem; font-size: 1rem; }
        }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 font-sans min-h-screen pb-10">

    <!-- ヘッダー -->
    <header class="bg-gray-800 border-b border-gray-700 p-4 text-center sticky top-0 z-10">
        <h1 class="text-2xl font-bold text-yellow-400 tracking-wider">LOTO7 PREDICTOR</h1>
        <p class="text-xs text-gray-400 mt-1">過去データ分析に基づく予想ツール</p>
        <p id="loading-msg" class="text-sm text-blue-400 mt-2 font-bold">データを読み込み中...</p>
        <p id="latest-info" class="text-xs text-green-400 mt-2 hidden"></p>
    </header>

    <main class="max-w-3xl mx-auto p-4 mt-4 space-y-8">

        <!-- 予想セクション（3パターン） -->
        <div>
            <h2 id="prediction-title" class="text-xl font-bold mb-4 text-center">次回の予想番号</h2>

            <!-- パターンA: 王道 -->
            <div class="bg-gray-800 p-5 rounded-xl shadow-lg border border-yellow-700 mb-4">
                <div class="flex items-center gap-2 mb-3">
                    <span class="text-xl">👑</span>
                    <h3 class="font-bold text-yellow-400 text-lg">王道</h3>
                    <span class="text-xs text-gray-400 ml-auto">出現頻度 + トレンド + ペア相性</span>
                </div>
                <div id="pattern-a-balls" class="flex flex-wrap gap-2 sm:gap-3 mb-3"></div>
                <p id="pattern-a-reason" class="text-xs text-gray-400"></p>
            </div>

            <!-- パターンB: 逆張り -->
            <div class="bg-gray-800 p-5 rounded-xl shadow-lg border border-blue-700 mb-4">
                <div class="flex items-center gap-2 mb-3">
                    <span class="text-xl">🧊</span>
                    <h3 class="font-bold text-blue-400 text-lg">逆張り</h3>
                    <span class="text-xs text-gray-400 ml-auto">冷えてる番号を優先採用</span>
                </div>
                <div id="pattern-b-balls" class="flex flex-wrap gap-2 sm:gap-3 mb-3"></div>
                <p id="pattern-b-reason" class="text-xs text-gray-400"></p>
            </div>

            <!-- パターンC: バランス -->
            <div class="bg-gray-800 p-5 rounded-xl shadow-lg border border-purple-700 mb-4">
                <div class="flex items-center gap-2 mb-3">
                    <span class="text-xl">⚖️</span>
                    <h3 class="font-bold text-purple-400 text-lg">バランス</h3>
                    <span class="text-xs text-gray-400 ml-auto">熱い3 + 冷え2 + ペア相性上位2</span>
                </div>
                <div id="pattern-c-balls" class="flex flex-wrap gap-2 sm:gap-3 mb-3"></div>
                <p id="pattern-c-reason" class="text-xs text-gray-400"></p>
            </div>
        </div>

        <!-- 熱い・冷えている番号 -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div class="bg-gray-800 p-4 rounded-xl border border-gray-700">
                <h3 class="font-bold text-red-400 mb-2 flex items-center"><span class="text-xl mr-2">🔥</span> 熱い番号</h3>
                <p class="text-xs text-gray-400 mb-3">最近10回で多く出ている番号</p>
                <div id="hot-numbers" class="flex flex-wrap gap-2"></div>
            </div>
            <div class="bg-gray-800 p-4 rounded-xl border border-gray-700">
                <h3 class="font-bold text-blue-400 mb-2 flex items-center"><span class="text-xl mr-2">🧊</span> 冷えている番号</h3>
                <p class="text-xs text-gray-400 mb-3">最近10回で一度も出ていない番号</p>
                <div id="cold-numbers" class="flex flex-wrap gap-2"></div>
            </div>
        </div>

        <!-- 出現頻度チャート -->
        <div class="bg-gray-800 p-4 rounded-xl border border-gray-700">
            <h3 class="font-bold mb-4">全期間の出現頻度</h3>
            <div class="w-full overflow-x-auto">
                <div style="min-width: 600px; height: 300px;">
                    <canvas id="freqChart"></canvas>
                </div>
            </div>
        </div>

    </main>

    <footer class="mt-12 p-6 text-center text-xs text-gray-500 border-t border-gray-800">
        <p>※当ツールは過去データの統計的分析に基づく予想を提供するものであり、宝くじの当選を保証するものではありません。購入は自己責任でお願いします。</p>
    </footer>

    <script>
        // --- データ状態管理 ---
        let historyData = [];    // スプレッドシートのデータ (index 0 が最新)
        let currentAnalysis = null;
        let nextRoundNum = 1;
        let freqChartInstance = null;

        // 初期化
        function init() {
            fetchSheetData();
        }

        // スプレッドシートからデータを取得
        async function fetchSheetData() {
            const sheetId = '1y_8fEZpj7rvJdx3AOMSxjxLsNh_zso2d_b1EVEZWNB4';
            const url = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:csv`;

            try {
                const res = await fetch(url);
                if (!res.ok) throw new Error('Network error');
                const csvText = await res.text();
                parseCSV(csvText);

                if (historyData.length > 0) {
                    nextRoundNum = historyData[0].round + 1;
                    document.getElementById('latest-info').innerText =
                        `最新データ: 第${historyData[0].round}回 (${historyData[0].date}) 読込完了`;
                    document.getElementById('latest-info').classList.remove('hidden');
                    document.getElementById('prediction-title').innerText = `第${nextRoundNum}回の予想番号`;
                }

                analyzeData();
                renderPrediction();
                renderCharts();
                document.getElementById('loading-msg').classList.add('hidden');
            } catch (e) {
                console.error(e);
                document.getElementById('loading-msg').innerText =
                    'データの読み込みに失敗したよ。スプレッドシートが公開されているか確認してね。';
                document.getElementById('loading-msg').classList.replace('text-blue-400', 'text-red-400');
            }
        }

        function parseCSV(csv) {
            historyData = [];
            const lines = csv.split('\n');
            for (let i = 1; i < lines.length; i++) {
                const line = lines[i].replace(/"/g, '').trim();
                if (!line) continue;
                const parts = line.split(',');
                if (parts.length >= 9) {
                    const roundNum = parseInt(parts[0].replace(/[^0-9]/g, ''), 10);
                    if (isNaN(roundNum)) continue;
                    const nums = [
                        parseInt(parts[2], 10), parseInt(parts[3], 10),
                        parseInt(parts[4], 10), parseInt(parts[5], 10),
                        parseInt(parts[6], 10), parseInt(parts[7], 10),
                        parseInt(parts[8], 10)
                    ];
                    historyData.push({ round: roundNum, date: parts[1], numbers: nums });
                }
            }
            historyData.sort((a, b) => b.round - a.round);
        }

        // 分析ロジック（3パターン生成）
        function analyzeData() {
            const counts = new Array(38).fill(0);
            const last10Counts = new Array(38).fill(0);
            const lastSeen = new Array(38).fill(-1);
            const pairs = {};

            historyData.forEach((drawObj, index) => {
                const draw = drawObj.numbers;
                draw.forEach(num => {
                    counts[num]++;
                    if (index < 10) last10Counts[num]++;
                    if (lastSeen[num] === -1) lastSeen[num] = index;

                    for (let i = 0; i < draw.length; i++) {
                        for (let j = i + 1; j < draw.length; j++) {
                            const p = `${draw[i]}-${draw[j]}`;
                            pairs[p] = (pairs[p] || 0) + 1;
                        }
                    }
                });
            });

            const hotNumbers = [];
            const coldNumbers = [];
            for (let i = 1; i <= 37; i++) {
                if (last10Counts[i] >= 3) hotNumbers.push(i);
                if (last10Counts[i] === 0) coldNumbers.push(i);
            }

            // スコアリング（全番号）
            const scores = [];
            for (let i = 1; i <= 37; i++) {
                let score = counts[i] * 5;
                let reasons = [`全期間で${counts[i]}回出現`];

                if (lastSeen[i] > 0 && lastSeen[i] <= 5) {
                    score += 15;
                    reasons.push(`直近5回以内に出ており間隔が良好`);
                }

                let maxPairCount = 0;
                let bestPartner = 0;
                for (let j = 1; j <= 37; j++) {
                    if (i === j) continue;
                    const p = i < j ? `${i}-${j}` : `${j}-${i}`;
                    if (pairs[p] && pairs[p] > maxPairCount) {
                        maxPairCount = pairs[p];
                        bestPartner = j;
                    }
                }

                if (maxPairCount >= 15) {
                    score += maxPairCount;
                    reasons.push(`${bestPartner}番とよく一緒に出る（${maxPairCount}回）`);
                }

                if (hotNumbers.includes(i)) {
                    score += 10;
                    reasons.push(`最近のトレンドに乗っている熱い番号`);
                }

                scores.push({ num: i, score, freq: counts[i], last10: last10Counts[i], maxPairCount, bestPartner, reasons });
            }

            scores.sort((a, b) => {
                if (b.score !== a.score) return b.score - a.score;
                if (b.freq !== a.freq) return b.freq - a.freq;
                return a.num - b.num;
            });

            // --- パターンA「王道」: スコア上位7個 ---
            const patternA = scores.slice(0, 7).sort((a, b) => a.num - b.num);

            // --- パターンB「逆張り」: last10Counts 0 or 1 の冷え番号を優先、足りない分は通常スコア順 ---
            const coldPool  = scores.filter(s => s.last10 <= 1);
            const warmPool  = scores.filter(s => s.last10 > 1);
            const bPick     = [...coldPool.slice(0, 5), ...warmPool.slice(0, 2)];
            const patternB  = bPick.slice(0, 7).sort((a, b) => a.num - b.num);

            // --- パターンC「バランス」: 熱い3 + 冷え2 + ペア相性上位2 ---
            const hotPool    = scores.filter(s => hotNumbers.includes(s.num));
            const coldPool2  = scores.filter(s => coldNumbers.includes(s.num));
            const pairSorted = [...scores].sort((a, b) => b.maxPairCount - a.maxPairCount);

            const c_hot  = hotPool.slice(0, 3);
            const usedC  = new Set(c_hot.map(s => s.num));

            const c_cold = coldPool2.filter(s => !usedC.has(s.num)).slice(0, 2);
            c_cold.forEach(s => usedC.add(s.num));

            const c_pair = pairSorted.filter(s => !usedC.has(s.num)).slice(0, 2);
            c_pair.forEach(s => usedC.add(s.num));

            let patternC = [...c_hot, ...c_cold, ...c_pair];
            if (patternC.length < 7) {
                const fill = scores.filter(s => !usedC.has(s.num)).slice(0, 7 - patternC.length);
                patternC = [...patternC, ...fill];
            }
            patternC = patternC.sort((a, b) => a.num - b.num);

            currentAnalysis = { patternA, patternB, patternC, counts, hotNumbers, coldNumbers, scores };
        }

        // 予想画面の描画
        function renderPrediction() {
            // パターンA（王道）
            const aContainer = document.getElementById('pattern-a-balls');
            aContainer.innerHTML = '';
            currentAnalysis.patternA.forEach(item => {
                aContainer.innerHTML += `<div class="ball ball-yellow">${item.num}</div>`;
            });
            document.getElementById('pattern-a-reason').textContent =
                `スコア上位7番号: ${currentAnalysis.patternA.map(i => i.num).join('・')}`;

            // パターンB（逆張り）
            const bContainer = document.getElementById('pattern-b-balls');
            bContainer.innerHTML = '';
            currentAnalysis.patternB.forEach(item => {
                bContainer.innerHTML += `<div class="ball ball-blue">${item.num}</div>`;
            });
            const coldInB = currentAnalysis.patternB.filter(i => i.last10 <= 1).map(i => i.num);
            document.getElementById('pattern-b-reason').textContent =
                `直近10回で0〜1回の番号を優先採用。冷え番号: ${coldInB.length > 0 ? coldInB.join('・') : 'なし'}`;

            // パターンC（バランス）
            const cContainer = document.getElementById('pattern-c-balls');
            cContainer.innerHTML = '';
            currentAnalysis.patternC.forEach(item => {
                cContainer.innerHTML += `<div class="ball ball-purple">${item.num}</div>`;
            });
            const hotInC  = currentAnalysis.patternC.filter(i => currentAnalysis.hotNumbers.includes(i.num)).map(i => i.num);
            const coldInC = currentAnalysis.patternC.filter(i => currentAnalysis.coldNumbers.includes(i.num)).map(i => i.num);
            document.getElementById('pattern-c-reason').textContent =
                `熱い番号(${hotInC.length > 0 ? hotInC.join('・') : 'なし'}) + ` +
                `冷え番号(${coldInC.length > 0 ? coldInC.join('・') : 'なし'}) + ペア相性上位でミックス`;

            // 熱い・冷えている
            const hotContainer  = document.getElementById('hot-numbers');
            hotContainer.innerHTML  = currentAnalysis.hotNumbers.map(n =>
                `<span class="inline-flex w-8 h-8 rounded-full bg-red-900 text-red-200 items-center justify-center text-sm font-bold border border-red-700">${n}</span>`
            ).join('') || '<span class="text-sm text-gray-500">なし</span>';

            const coldContainer = document.getElementById('cold-numbers');
            coldContainer.innerHTML = currentAnalysis.coldNumbers.map(n =>
                `<span class="inline-flex w-8 h-8 rounded-full bg-blue-900 text-blue-200 items-center justify-center text-sm font-bold border border-blue-700">${n}</span>`
            ).join('') || '<span class="text-sm text-gray-500">なし</span>';
        }

        // チャート描画
        function renderCharts() {
            const ctxFreq = document.getElementById('freqChart').getContext('2d');
            const labels = [];
            const data = [];
            for (let i = 1; i <= 37; i++) {
                labels.push(i);
                data.push(currentAnalysis.counts[i]);
            }

            if (freqChartInstance) freqChartInstance.destroy();
            freqChartInstance = new Chart(ctxFreq, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: '全期間の出現回数',
                        data: data,
                        backgroundColor: 'rgba(250, 204, 21, 0.6)',
                        borderColor:     'rgba(250, 204, 21, 1)',
                        borderWidth: 1
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: { beginAtZero: true, grid: { color: 'rgba(255,255,255,0.1)' }, ticks: { color: '#9ca3af' } },
                        x: { grid: { display: false }, ticks: { color: '#9ca3af' } }
                    },
                    plugins: {
                        legend: { labels: { color: '#9ca3af' } }
                    }
                }
            });
        }

        // 起動
        window.onload = init;
    </script>
</body>
</html>
