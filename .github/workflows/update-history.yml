name: Update History

on:
  schedule:
    # 毎週木曜 12:30 UTC (21:30 JST) — LOTO6抽選（木曜）翌朝に実行
    - cron: '30 12 * * 4'
    # 毎週金曜 8:30 UTC (17:30 JST) — LOTO7抽選（金曜）翌朝に実行
    - cron: '30 8 * * 5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Update history.json
        run: node scripts/predict.js

      - name: Commit and push changes
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/history.json
          git diff --staged --quiet || git commit -m "chore: update history.json [skip ci]"
          git push
