name: Update History

on:
  schedule:
    - cron: '0 21 * * 6'    # 土曜 21:00 UTC = 日曜 6:00 JST（LOTO7予想）
    - cron: '0 21 * * 1'    # 月曜 21:00 UTC = 火曜 6:00 JST（LOTO6木曜予想）
    - cron: '0 21 * * 5'    # 金曜 21:00 UTC = 土曜 6:00 JST（LOTO6月曜予想）
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Update history.json
        run: node scripts/predict.js

      - name: Commit and push changes
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/history.json
          git diff --staged --quiet || git commit -m "chore: update history.json [skip ci]"
          git push
